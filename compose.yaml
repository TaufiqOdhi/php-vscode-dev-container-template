services:
  app:
    image: ghcr.io/taufiqodhi/php-vscode-dev-container-template
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - ./public:/var/www/html/public:ro
      - ./codex-sdk:/home/vscode/.codex
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      PHPMYADMIN_PORT: ${PHPMYADMIN_PORT:-8081}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-app}
      MARIADB_USER: ${DB_USERNAME:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-app_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 32M
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
